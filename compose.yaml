name: solo71-reelbench
services:
  bench:
    build:
      context: .
      args:
        REELBENCH_DEPS_IMAGE: ${REELBENCH_DEPS_IMAGE:-python:3.11-slim}
    image: ${REELBENCH_IMAGE:-solo71-reelbench:1.0}
    network_mode: bridge
    environment:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      WAITRESS_THREADS: 4
    ports:
      - "127.0.0.1:${REELBENCH_PORT:-19990}:8000"
    volumes:
      - reel-library:/var/lib/reelbench
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/api/health', timeout=3).status==200"]
      interval: 4s
      timeout: 4s
      retries: 12
volumes:
  reel-library:
